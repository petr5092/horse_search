name: horse-s1
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: horse_s1
      POSTGRES_USER: platform_owner
      POSTGRES_PASSWORD: local-owner-password
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./dev/s1/postgres-init.sql:/docker-entrypoint-initdb.d/10-s1.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform_owner -d horse_s1']
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: horse-s1-local
      MINIO_ROOT_PASSWORD: horse-s1-local-secret-change-me
    ports:
      - '127.0.0.1:19000:9000'
      - '127.0.0.1:19001:9001'
    volumes:
      - minio-data:/data
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    restart: on-failure
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 horse-s1-local horse-s1-local-secret-change-me &&
        mc ready local &&
        mc mb --ignore-existing local/horse-s1-fixtures &&
        mc anonymous set none local/horse-s1-fixtures &&
        echo '{"Rules":[{"ID":"expire-staging","Status":"Enabled","Filter":{"Prefix":"staging/"},"Expiration":{"Days":1}}]}' | mc ilm rule import local/horse-s1-fixtures
volumes:
  postgres-data:
  minio-data:
